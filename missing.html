<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find missing number</title>
</head>

<body>
  <h1>Задача к собеседованиям</h1>
  <h2>Поиск пропущенного числа</h2>
  <script>
    // Решение: Используем формулу суммы арифметической прогрессии
    // Сумма полного ряда от 1 до n = n*(n+1)/2
    function findMissingNumber(arr) {
      const n = arr.length + 1; // Изначальный размер массива (n) на 1 больше
      const expectedSum = (n * (n + 1)) / 2;
      const actualSum = arr.reduce((sum, num) => sum + num, 0);
      return expectedSum - actualSum;
    }

    console.log(findMissingNumber([1, 2, 4, 5, 6])); // 3</script>

</body>

</html>
