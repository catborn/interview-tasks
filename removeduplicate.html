<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Duplicates from Array</title>
</head>

<body>
  <h1>Задачи к собеседованиям</h1>
  <h2>Написать функцию, которая удаляет дубликаты из массива</h2>
  <script>
    // Решение 1: Использование Set (самое простое и эффективное)
    function removeDuplicatesSet(arr) {
      return [...new Set(arr)];
    }

    // Решение 2: Использование filter и indexOf (показывает понимание)
    function removeDuplicatesFilter(arr) {
      return arr.filter((item, index) => arr.indexOf(item) === index);
    }

    // Решение 3: Использование reduce (более сложное)
    function removeDuplicatesReduce(arr) {
      return arr.reduce((unique, item) => {
        return unique.includes(item) ? unique : [...unique, item];
      }, []);
    }

    console.log(removeDuplicatesSet([1, 2, 2, 3, 4, 4, 5])); // [1, 2, 3, 4, 5]
  </script>
</body>

</html>
